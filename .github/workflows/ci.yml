name: CI

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  desktop:
    name: Desktop regressions
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Restore desktop harness dependency
        shell: pwsh
        run: |
          nuget install Caliburn.Micro.Core -Version 3.2.0 -OutputDirectory packages -Source https://api.nuget.org/v3/index.json -NonInteractive -DirectDownload
          if ($LASTEXITCODE -ne 0) { throw 'Desktop dependency restore failed.' }
      - name: Run production-source CLR regressions
        shell: pwsh
        run: ./tools/ci/run-desktop.ps1
  source:
    name: Source and tool checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - run: python tools/ci/check.py
      - name: Retain source inventory
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: source-inventory
          path: .tmp/ci/*-inventory.json
          if-no-files-found: ignore
          retention-days: 14
  required:
    name: CI required
    if: always()
    needs: [desktop, source]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require every regression job
        env:
          DESKTOP_RESULT: ${{ needs.desktop.result }}
          SOURCE_RESULT: ${{ needs.source.result }}
        run: test "$DESKTOP_RESULT" = success && test "$SOURCE_RESULT" = success
